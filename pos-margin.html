<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600&family=Noto+Sans+KR:wght@300;400;500;600&display=swap">
<style>
/* â•â•â•â•â•â•â•â•â•â•â• TOKENS â•â•â•â•â•â•â•â•â•â•â• */
:root {
  --bg:           #F3EBEA;
  --surface:      #FFFFFF;
  --surface-2:    #F9F4F3;
  --border:       #DDD0CB;
  --primary:      #72202F;
  --primary-dk:   #4E1520;
  --primary-lt:   #F0E5E7;
  --acc-pos:      #BF7730;   /* ì¹´ë“œÂ·POS â€” tawny */
  --acc-cash:     #2A5E6A;   /* í˜„ê¸ˆÂ·ê³„ì¢Œ â€” slate teal */
  --text:         #1C1210;
  --text-2:       #7A6460;
  --text-3:       #B0A09C;
  --success:      #2C7A44;
  --success-bg:   #E9F5EE;
  --warn:         #B5661A;
  --warn-bg:      #FBF0E4;
  --shadow-sm:    0 1px 3px rgba(28,18,16,.08);
  --shadow-md:    0 4px 14px rgba(28,18,16,.10);
  --r:            10px;
  --r-sm:         6px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:         #160C0B;
    --surface:    #221310;
    --surface-2:  #1A0E0C;
    --border:     #3A2218;
    --primary:    #D06575;
    --primary-dk: #E08595;
    --primary-lt: #3A1820;
    --text:       #F2E6E3;
    --text-2:     #9A8480;
    --text-3:     #6A5450;
    --success:    #4CC870;
    --success-bg: #0A2818;
    --warn:       #E08040;
    --warn-bg:    #281408;
    --shadow-sm:  0 1px 3px rgba(0,0,0,.35);
    --shadow-md:  0 4px 14px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"] {
  --bg:         #160C0B;
  --surface:    #221310;
  --surface-2:  #1A0E0C;
  --border:     #3A2218;
  --primary:    #D06575;
  --primary-dk: #E08595;
  --primary-lt: #3A1820;
  --text:       #F2E6E3;
  --text-2:     #9A8480;
  --text-3:     #6A5450;
  --success:    #4CC870;
  --success-bg: #0A2818;
  --warn:       #E08040;
  --warn-bg:    #281408;
  --shadow-sm:  0 1px 3px rgba(0,0,0,.35);
  --shadow-md:  0 4px 14px rgba(0,0,0,.45);
}

/* â•â•â•â•â•â•â•â•â•â•â• RESET â•â•â•â•â•â•â•â•â•â•â• */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  font-family: 'Noto Sans KR', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
}
img { max-width: 100%; }
button { cursor: pointer; font-family: inherit; }

/* â•â•â•â•â•â•â•â•â•â•â• HEADER â•â•â•â•â•â•â•â•â•â•â• */
.app-header {
  background: var(--primary);
  color: #fff;
  padding: 13px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
.app-logo {
  font-family: 'Noto Serif KR', serif;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.2px;
  display: flex;
  align-items: center;
  gap: 7px;
}
.app-logo small {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 11px;
  font-weight: 400;
  opacity: .7;
  letter-spacing: 0;
  margin-left: 2px;
}
.header-r {
  display: flex;
  align-items: center;
  gap: 8px;
}
input[type="month"].month-pick {
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.25);
  color: #fff;
  border-radius: var(--r-sm);
  padding: 5px 9px;
  font-size: 13px;
  font-family: inherit;
  -webkit-appearance: none;
}
input[type="month"].month-pick::-webkit-calendar-picker-indicator { filter: invert(1); opacity: .7; }
.sync-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #4ADE80;
  box-shadow: 0 0 0 2px rgba(74,222,128,.3);
  flex-shrink: 0;
  transition: background .3s;
}
.sync-dot.off { background: #666; box-shadow: none; }
.refresh-btn {
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.25);
  color: #fff;
  border-radius: var(--r-sm);
  padding: 4px 10px;
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s;
}
.refresh-btn:hover { background: rgba(255,255,255,.28); }
.refresh-btn:disabled { opacity: .5; cursor: default; }

/* â•â•â•â•â•â•â•â•â•â•â• UPLOAD STRIP â•â•â•â•â•â•â•â•â•â•â• */
.upload-strip {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.upload-btn {
  background: var(--acc-pos);
  color: #fff;
  border: none;
  border-radius: var(--r-sm);
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: opacity .15s;
  flex-shrink: 0;
}
.upload-btn:hover { opacity: .88; }
.file-input { display: none; }
.pos-status {
  font-size: 12px;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
}
.pos-status.ok { color: var(--success); font-weight: 500; }

/* â•â•â•â•â•â•â•â•â•â•â• SOURCE TOGGLE â•â•â•â•â•â•â•â•â•â•â• */
.seg {
  display: flex;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 3px;
  gap: 2px;
  margin-left: auto;
}
.seg-btn {
  border: none;
  background: transparent;
  color: var(--text-2);
  border-radius: 4px;
  padding: 5px 11px;
  font-size: 12px;
  font-weight: 500;
  transition: all .15s;
  white-space: nowrap;
}
.seg-btn.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}
.seg-btn.active.s-pos  { color: var(--acc-pos); }
.seg-btn.active.s-cash { color: var(--acc-cash); }
.seg-btn.active.s-all  { color: var(--primary); }

/* â•â•â•â•â•â•â•â•â•â•â• STATS â•â•â•â•â•â•â•â•â•â•â• */
.stats-row {
  padding: 14px 18px 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.stat {
  background: var(--surface);
  border-radius: var(--r);
  padding: 12px 14px;
  box-shadow: var(--shadow-sm);
}
.stat-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .7px;
  text-transform: uppercase;
  color: var(--text-2);
  margin-bottom: 5px;
}
.stat-val {
  font-size: 17px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
  color: var(--text);
}
.stat.s-margin .stat-val { color: var(--success); }
.stat.s-rate .stat-val {
  display: flex;
  align-items: baseline;
  gap: 2px;
}
.rate-bar-wrap { flex: 1; }
.rate-bar-bg {
  height: 5px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 6px;
}
.rate-bar-fill {
  height: 100%;
  background: var(--success);
  border-radius: 3px;
  transition: width .5s ease;
}

/* â•â•â•â•â•â•â•â•â•â•â• TABS â•â•â•â•â•â•â•â•â•â•â• */
.tab-nav {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 18px;
  margin-top: 14px;
}
.tab-btn {
  border: none;
  background: transparent;
  color: var(--text-2);
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 500;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: all .15s;
}
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

/* â•â•â•â•â•â•â•â•â•â•â• CONTENT â•â•â•â•â•â•â•â•â•â•â• */
.content {
  padding: 16px 18px 40px;
  max-width: 980px;
  margin: 0 auto;
}
.panel { display: none; }
.panel.active { display: block; }

/* â•â•â•â•â•â•â•â•â•â•â• WARN BANNER â•â•â•â•â•â•â•â•â•â•â• */
.warn-banner {
  background: var(--warn-bg);
  color: var(--warn);
  border-radius: var(--r-sm);
  padding: 9px 13px;
  font-size: 12px;
  margin-bottom: 14px;
  display: flex;
  align-items: flex-start;
  gap: 6px;
  line-height: 1.5;
}

/* â•â•â•â•â•â•â•â•â•â•â• EMPTY STATE â•â•â•â•â•â•â•â•â•â•â• */
.empty {
  text-align: center;
  padding: 56px 20px;
  color: var(--text-2);
}
.empty-icon { font-size: 44px; margin-bottom: 14px; }
.empty h3 { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 7px; }
.empty p { font-size: 13px; line-height: 1.8; }
.empty .empty-hint {
  display: inline-block;
  margin-top: 12px;
  background: var(--primary-lt);
  color: var(--primary);
  border-radius: var(--r-sm);
  padding: 7px 14px;
  font-size: 12px;
  font-weight: 500;
}

/* â•â•â•â•â•â•â•â•â•â•â• TABLE â•â•â•â•â•â•â•â•â•â•â• */
.tbl-wrap { overflow-x: auto; }
.tbl {
  width: 100%;
  border-collapse: collapse;
  background: var(--surface);
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  font-size: 13px;
}
.tbl th {
  background: var(--surface-2);
  color: var(--text-2);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .6px;
  text-transform: uppercase;
  padding: 9px 12px;
  text-align: right;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.tbl th:first-child { text-align: left; }
.tbl td {
  padding: 9px 12px;
  text-align: right;
  border-bottom: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
  color: var(--text);
  white-space: nowrap;
}
.tbl td:first-child { text-align: left; white-space: normal; }
.tbl tbody tr:last-child td { border-bottom: none; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl .total-row td {
  background: var(--surface-2);
  font-weight: 600;
  border-top: 2px solid var(--border);
  border-bottom: none;
}
.col-green { color: var(--success); }
.col-warn  { color: var(--warn); font-size: 11px; }
.col-muted { color: var(--text-3); font-size: 11px; }

/* mini bar */
.mbar-cell { display: flex; align-items: center; justify-content: flex-end; gap: 7px; }
.mbar { width: 46px; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
.mbar-fill { height: 100%; background: var(--success); border-radius: 3px; transition: width .4s; }

/* badges */
.badge {
  display: inline-block;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 500;
  letter-spacing: .3px;
  white-space: nowrap;
}
.bdg-pos  { background: #FBF0E3; color: var(--acc-pos); }
.bdg-cash { background: #E3EFF2; color: var(--acc-cash); }

/* â•â•â•â•â•â•â•â•â•â•â• SETTLE TAB â•â•â•â•â•â•â•â•â•â•â• */
.settle-section {
  background: var(--surface);
  border-radius: var(--r);
  padding: 16px 18px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}
.settle-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .7px;
  text-transform: uppercase;
  color: var(--text-2);
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.fee-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.fee-row:last-child { border-bottom: none; }
.fee-label {
  min-width: 90px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
}
.settle-input {
  padding: 5px 9px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  text-align: right;
  font-variant-numeric: tabular-nums;
  width: 130px;
}
.settle-input:focus { outline: none; border-color: var(--primary); }
.settle-input-rate { width: 60px; }
.fee-arrow { color: var(--text-3); font-size: 12px; }
.fee-result {
  min-width: 110px;
  text-align: right;
  font-size: 13px;
  font-weight: 600;
  color: var(--warn);
  font-variant-numeric: tabular-nums;
}
.settle-sub {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;
  padding: 10px 0 2px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  border-top: 1px solid var(--border);
  margin-top: 4px;
}
.settle-sub .sub-val { color: var(--warn); }

.expense-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
}
.expense-row:last-child { border-bottom: none; }
.expense-name {
  flex: 1;
  min-width: 80px;
}
.expense-del {
  background: none;
  border: none;
  color: var(--text-3);
  font-size: 18px;
  padding: 0 4px;
  cursor: pointer;
  line-height: 1;
  transition: color .15s;
}
.expense-del:hover { color: var(--primary); }
.add-expense-btn {
  width: 100%;
  margin-top: 10px;
  padding: 8px;
  border: 1px dashed var(--border);
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--text-2);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: all .15s;
}
.add-expense-btn:hover { border-color: var(--primary); color: var(--primary); }

.net-box {
  background: var(--success-bg);
  border-radius: var(--r);
  padding: 20px 20px 18px;
  margin-bottom: 14px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 16px;
  align-items: end;
}
.net-box-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .7px;
  text-transform: uppercase;
  color: var(--success);
  grid-column: 1/-1;
  margin-bottom: 4px;
}
.net-box-formula {
  font-size: 11px;
  color: var(--text-2);
  line-height: 1.8;
  align-self: center;
}
.net-box-val {
  font-size: 28px;
  font-weight: 700;
  color: var(--success);
  font-variant-numeric: tabular-nums;
  text-align: right;
  white-space: nowrap;
}
.net-box-val.neg { color: var(--warn); }

/* â•â•â•â•â•â•â•â•â•â•â• COST EDIT â•â•â•â•â•â•â•â•â•â•â• */
.unmatched-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding-top: 6px;
}
.unmatched-item {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.unmatched-name {
  flex: 1;
  min-width: 130px;
  font-size: 12px;
  font-weight: 500;
  color: var(--warn);
}
.cost-edit-wrap {
  display: flex;
  align-items: center;
  gap: 5px;
}
.cost-edit-input {
  width: 90px;
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface);
  color: var(--text);
  font-size: 12px;
  font-family: inherit;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.cost-edit-input:focus { outline: none; border-color: var(--primary); }
.cost-save-btn {
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 4px;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity .15s;
}
.cost-save-btn:hover { opacity: .85; }
.cost-saved-ok { font-size: 11px; color: var(--success); display: none; }
.col-custom { color: var(--acc-cash); font-size: 11px; }

/* â•â•â•â•â•â•â•â•â•â•â• RESPONSIVE â•â•â•â•â•â•â•â•â•â•â• */
@media (max-width: 680px) {
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .stat-val { font-size: 15px; }
  .seg { margin-left: 0; width: 100%; }
  .seg-btn { flex: 1; text-align: center; }
  .upload-strip { gap: 8px; }
}
@media (max-width: 460px) {
  .tbl { font-size: 12px; }
  .tbl th, .tbl td { padding: 8px 8px; }
  .hide-xs { display: none !important; }
}
</style>
</head>
