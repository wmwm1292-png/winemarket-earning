<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POS 마진 분석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600&family=Noto+Sans+KR:wght@300;400;500;600&display=swap">
<style>
/* ═══════════ TOKENS ═══════════ */
:root {
  --bg:           #F3EBEA;
  --surface:      #FFFFFF;
  --surface-2:    #F9F4F3;
  --border:       #DDD0CB;
  --primary:      #72202F;
  --primary-dk:   #4E1520;
  --primary-lt:   #F0E5E7;
  --acc-pos:      #BF7730;   /* 카드·POS — tawny */
  --acc-cash:     #2A5E6A;   /* 현금·계좌 — slate teal */
  --text:         #1C1210;
  --text-2:       #7A6460;
  --text-3:       #B0A09C;
  --success:      #2C7A44;
  --success-bg:   #E9F5EE;
  --warn:         #B5661A;
  --warn-bg:      #FBF0E4;
  --shadow-sm:    0 1px 3px rgba(28,18,16,.08);
  --shadow-md:    0 4px 14px rgba(28,18,16,.10);
  --r:            10px;
  --r-sm:         6px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:         #160C0B;
    --surface:    #221310;
    --surface-2:  #1A0E0C;
    --border:     #3A2218;
    --primary:    #D06575;
    --primary-dk: #E08595;
    --primary-lt: #3A1820;
    --text:       #F2E6E3;
    --text-2:     #9A8480;
    --text-3:     #6A5450;
    --success:    #4CC870;
    --success-bg: #0A2818;
    --warn:       #E08040;
    --warn-bg:    #281408;
    --shadow-sm:  0 1px 3px rgba(0,0,0,.35);
    --shadow-md:  0 4px 14px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"] {
  --bg:         #160C0B;
  --surface:    #221310;
  --surface-2:  #1A0E0C;
  --border:     #3A2218;
  --primary:    #D06575;
  --primary-dk: #E08595;
  --primary-lt: #3A1820;
  --text:       #F2E6E3;
  --text-2:     #9A8480;
  --text-3:     #6A5450;
  --success:    #4CC870;
  --success-bg: #0A2818;
  --warn:       #E08040;
  --warn-bg:    #281408;
  --shadow-sm:  0 1px 3px rgba(0,0,0,.35);
  --shadow-md:  0 4px 14px rgba(0,0,0,.45);
}

/* ═══════════ COST EDITOR MODAL ═══════════ */
.cost-modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9998;
  background: rgba(0,0,0,.45);
  align-items: flex-end;
  justify-content: center;
}
.cost-modal-bg.open { display: flex; }
.cost-modal {
  background: var(--surface);
  border-radius: 18px 18px 0 0;
  width: 100%;
  max-width: 480px;
  padding: 24px 20px 32px;
  box-shadow: 0 -4px 24px rgba(0,0,0,.18);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.cost-modal-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
}
.cost-modal-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--primary);
  background: var(--primary-lt);
  padding: 6px 12px;
  border-radius: var(--r-sm);
  word-break: break-all;
}
.cost-modal-hint {
  font-size: 11px;
  color: var(--text-3);
  margin-top: -4px;
}
.cost-modal-input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  color: var(--text);
  font-size: 16px;
  font-family: inherit;
  outline: none;
}
.cost-modal-input:focus { border-color: var(--primary); }
.cost-modal-btns {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}
.cost-modal-cancel {
  flex: 1;
  padding: 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  color: var(--text-2);
  font-size: 14px;
}
.cost-modal-save {
  flex: 2;
  padding: 12px;
  border: none;
  border-radius: var(--r-sm);
  background: var(--primary);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
}
.cost-modal-save:active { background: var(--primary-dk); }
.cost-modal-ok {
  display: none;
  text-align: center;
  color: var(--success);
  font-size: 13px;
  font-weight: 500;
}
/* ── 전체내역 날짜 그룹 ── */
.date-group-hdr {
  background: var(--surface-2);
  cursor: pointer;
  user-select: none;
}
.date-group-hdr:hover { background: var(--border); }
.date-group-hdr td {
  padding: 9px 12px;
  font-size: 13px;
  font-weight: 600;
}
.dg-arrow {
  display: inline-block;
  font-size: 10px;
  margin-right: 6px;
  color: var(--text-3);
  transition: transform .15s;
}
.dg-open .dg-arrow { transform: rotate(90deg); }
.dg-summary {
  font-size: 11px;
  color: var(--text-2);
  font-weight: 400;
  margin-left: 8px;
}
.date-group-body { display: none; }
.date-group-body.open { display: table-row-group; }

/* ── 맨 위/아래 버튼 ── */
.scroll-nav {
  position: fixed;
  right: 14px;
  bottom: 72px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 200;
}
.scroll-nav-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  font-size: 17px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
  line-height: 1;
}
.scroll-nav-btn:hover {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

/* 원가 편집 버튼 (테이블 안) */
.cost-edit-btn {
  background: var(--primary-lt);
  border: 1px solid var(--border);
  cursor: pointer;
  font-size: 11px;
  color: var(--primary);
  padding: 2px 6px;
  border-radius: 4px;
  vertical-align: middle;
  line-height: 1.4;
  white-space: nowrap;
}
.cost-edit-btn:hover { background: var(--primary); color: #fff; }

/* ═══════════ VAT SECTION ═══════════ */
.vat-section { border-left: 3px solid var(--acc-pos); }
.vat-grid { display: flex; flex-direction: column; gap: 6px; margin: 10px 0 8px; }
.vat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
}
.vat-row.vat-total { margin-top: 4px; }
.vat-label { color: var(--text-2); }
.vat-hint { font-size: 11px; color: var(--text-3); }
.vat-val { font-weight: 600; font-variant-numeric: tabular-nums; }
.vat-val.warn { color: var(--warn); }
.vat-val.ok   { color: var(--success); }
.vat-divider {
  height: 1px;
  background: var(--border);
  margin: 4px 0;
}
.vat-note {
  font-size: 11px;
  color: var(--text-3);
  line-height: 1.6;
  margin-top: 8px;
}

/* ═══════════ SORT HEADERS ═══════════ */
.sort-th {
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.sort-th:hover { color: var(--primary); }
.sort-arrow {
  display: inline-block;
  font-size: 11px;
  margin-left: 3px;
  color: var(--primary);
  font-weight: 700;
}
.sort-arrow.inactive {
  color: var(--text-3);
  font-weight: 400;
}

/* ═══════════ DRAG OVERLAY ═══════════ */
.drag-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(114, 32, 47, 0.88);
  backdrop-filter: blur(4px);
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.drag-overlay.visible {
  display: flex;
  pointer-events: all;
}
.drag-overlay-inner {
  text-align: center;
  color: #fff;
  padding: 48px;
  border: 2.5px dashed rgba(255,255,255,.6);
  border-radius: 20px;
  background: rgba(255,255,255,.08);
}
.drag-overlay-icon {
  font-size: 52px;
  margin-bottom: 16px;
  animation: bounce 0.6s ease infinite alternate;
}
@keyframes bounce {
  from { transform: translateY(0); }
  to   { transform: translateY(-8px); }
}
.drag-overlay-text {
  font-family: 'Noto Serif KR', serif;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -.01em;
  margin-bottom: 8px;
}
.drag-overlay-sub {
  font-size: 13px;
  opacity: .75;
}

/* ═══════════ RESET ═══════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  font-family: 'Noto Sans KR', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
}
img { max-width: 100%; }
button { cursor: pointer; font-family: inherit; }

/* ═══════════ HEADER ═══════════ */
.app-header {
  background: var(--primary);
  color: #fff;
  padding: 13px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
.app-logo {
  font-family: 'Noto Serif KR', serif;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.2px;
  display: flex;
  align-items: center;
  gap: 7px;
}
.app-logo small {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 11px;
  font-weight: 400;
  opacity: .7;
  letter-spacing: 0;
  margin-left: 2px;
}
.header-r {
  display: flex;
  align-items: center;
  gap: 8px;
}
input[type="month"].month-pick {
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.25);
  color: #fff;
  border-radius: var(--r-sm);
  padding: 5px 9px;
  font-size: 13px;
  font-family: inherit;
  -webkit-appearance: none;
}
input[type="month"].month-pick::-webkit-calendar-picker-indicator { filter: invert(1); opacity: .7; }
.sync-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #4ADE80;
  box-shadow: 0 0 0 2px rgba(74,222,128,.3);
  flex-shrink: 0;
  transition: background .3s;
}
.sync-dot.off { background: #666; box-shadow: none; }
.refresh-btn {
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.25);
  color: #fff;
  border-radius: var(--r-sm);
  padding: 4px 10px;
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s;
}
.refresh-btn:hover { background: rgba(255,255,255,.28); }
.refresh-btn:disabled { opacity: .5; cursor: default; }

/* ═══════════ UPLOAD STRIP ═══════════ */
.upload-strip {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.upload-btn {
  background: var(--acc-pos);
  color: #fff;
  border: none;
  border-radius: var(--r-sm);
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: opacity .15s;
  flex-shrink: 0;
}
.upload-btn:hover { opacity: .88; }
.file-input { display: none; }
.pos-status {
  font-size: 12px;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
}
.pos-status.ok { color: var(--success); font-weight: 500; }

/* ═══════════ SOURCE TOGGLE ═══════════ */
.seg {
  display: flex;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 3px;
  gap: 2px;
  margin-left: auto;
}
.seg-btn {
  border: none;
  background: transparent;
  color: var(--text-2);
  border-radius: 4px;
  padding: 5px 11px;
  font-size: 12px;
  font-weight: 500;
  transition: all .15s;
  white-space: nowrap;
}
.seg-btn.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}
.seg-btn.active.s-pos  { color: var(--acc-pos); }
.seg-btn.active.s-cash { color: var(--acc-cash); }
.seg-btn.active.s-all  { color: var(--primary); }

/* ═══════════ STATS ═══════════ */
.stats-row {
  padding: 14px 18px 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.stat {
  background: var(--surface);
  border-radius: var(--r);
  padding: 12px 14px;
  box-shadow: var(--shadow-sm);
}
.stat-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .7px;
  text-transform: uppercase;
  color: var(--text-2);
  margin-bottom: 5px;
}
.stat-val {
  font-size: 17px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
  color: var(--text);
}
.stat.s-margin .stat-val { color: var(--success); }
.stat.s-rate .stat-val {
  display: flex;
  align-items: baseline;
  gap: 2px;
}
.rate-bar-wrap { flex: 1; }
.rate-bar-bg {
  height: 5px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 6px;
}
.rate-bar-fill {
  height: 100%;
  background: var(--success);
  border-radius: 3px;
  transition: width .5s ease;
}

/* ═══════════ TABS ═══════════ */
.tab-nav {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 18px;
  margin-top: 14px;
}
.tab-btn {
  border: none;
  background: transparent;
  color: var(--text-2);
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 500;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: all .15s;
}
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

/* ═══════════ CONTENT ═══════════ */
.content {
  padding: 16px 18px 40px;
  max-width: 980px;
  margin: 0 auto;
}
.panel { display: none; }
.panel.active { display: block; }

/* ═══════════ WARN BANNER ═══════════ */
.warn-banner {
  background: var(--warn-bg);
  color: var(--warn);
  border-radius: var(--r-sm);
  padding: 9px 13px;
  font-size: 12px;
  margin-bottom: 14px;
  display: flex;
  align-items: flex-start;
  gap: 6px;
  line-height: 1.5;
}

/* ═══════════ EMPTY STATE ═══════════ */
.empty {
  text-align: center;
  padding: 56px 20px;
  color: var(--text-2);
}
.empty-icon { font-size: 44px; margin-bottom: 14px; }
.empty h3 { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 7px; }
.empty p { font-size: 13px; line-height: 1.8; }
.empty .empty-hint {
  display: inline-block;
  margin-top: 12px;
  background: var(--primary-lt);
  color: var(--primary);
  border-radius: var(--r-sm);
  padding: 7px 14px;
  font-size: 12px;
  font-weight: 500;
}

/* ═══════════ TABLE ═══════════ */
.tbl-wrap { overflow-x: auto; }
.tbl {
  width: 100%;
  border-collapse: collapse;
  background: var(--surface);
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  font-size: 13px;
}
.tbl th {
  background: var(--surface-2);
  color: var(--text-2);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .6px;
  text-transform: uppercase;
  padding: 9px 12px;
  text-align: right;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.tbl th:first-child { text-align: left; }
.tbl td {
  padding: 9px 12px;
  text-align: right;
  border-bottom: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
  color: var(--text);
  white-space: nowrap;
}
.tbl td:first-child { text-align: left; white-space: normal; }
.tbl tbody tr:last-child td { border-bottom: none; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl .total-row td {
  background: var(--surface-2);
  font-weight: 600;
  border-top: 2px solid var(--border);
  border-bottom: none;
}
.col-green { color: var(--success); }
.col-warn  { color: var(--warn); font-size: 11px; }
.col-muted { color: var(--text-3); font-size: 11px; }

/* mini bar */
.mbar-cell { display: flex; align-items: center; justify-content: flex-end; gap: 7px; }
.mbar { width: 46px; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
.mbar-fill { height: 100%; background: var(--success); border-radius: 3px; transition: width .4s; }

/* badges */
.badge {
  display: inline-block;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 500;
  letter-spacing: .3px;
  white-space: nowrap;
}
.bdg-pos  { background: #FBF0E3; color: var(--acc-pos); }
.bdg-cash { background: #E3EFF2; color: var(--acc-cash); }

/* ═══════════ SETTLE TAB ═══════════ */
.settle-section {
  background: var(--surface);
  border-radius: var(--r);
  padding: 16px 18px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}
.settle-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .7px;
  text-transform: uppercase;
  color: var(--text-2);
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.fee-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.fee-row:last-child { border-bottom: none; }
.fee-label {
  min-width: 90px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
}
.settle-input {
  padding: 5px 9px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  text-align: right;
  font-variant-numeric: tabular-nums;
  width: 130px;
}
.settle-input:focus { outline: none; border-color: var(--primary); }
.settle-input-rate { width: 60px; }
.fee-arrow { color: var(--text-3); font-size: 12px; }
.fee-result {
  min-width: 110px;
  text-align: right;
  font-size: 13px;
  font-weight: 600;
  color: var(--warn);
  font-variant-numeric: tabular-nums;
}
.settle-sub {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;
  padding: 10px 0 2px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  border-top: 1px solid var(--border);
  margin-top: 4px;
}
.settle-sub .sub-val { color: var(--warn); }

.expense-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
}
.expense-row:last-child { border-bottom: none; }
.expense-name {
  flex: 1;
  min-width: 80px;
}
.expense-del {
  background: none;
  border: none;
  color: var(--text-3);
  font-size: 18px;
  padding: 0 4px;
  cursor: pointer;
  line-height: 1;
  transition: color .15s;
}
.expense-del:hover { color: var(--primary); }
.add-expense-btn {
  width: 100%;
  margin-top: 10px;
  padding: 8px;
  border: 1px dashed var(--border);
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--text-2);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: all .15s;
}
.add-expense-btn:hover { border-color: var(--primary); color: var(--primary); }

.net-box {
  background: var(--success-bg);
  border-radius: var(--r);
  padding: 20px 20px 18px;
  margin-bottom: 14px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 16px;
  align-items: end;
}
.net-box-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .7px;
  text-transform: uppercase;
  color: var(--success);
  grid-column: 1/-1;
  margin-bottom: 4px;
}
.net-box-formula {

<script>
/* ═══════════ STATE ═══════════ */

/* ═══════════ SYNC DOT ═══════════ */
function setSyncDot(ok) {
  document.getElementById('syncDot').className = 'sync-dot' + (ok ? '' : ' off');
}

/* ═══════════ EXCEL UPLOAD ═══════════ */
function processFiles(files) {
  // 확장자 체크 — 드래그앤드롭은 필터링, 파일 input은 이미 accept로 제한됨
  const xlsFiles = files.filter(f => /\.(xlsx|xls)$/i.test(f.name) || f.type.includes('spreadsheet') || f.type.includes('excel') || f.type === '');
  const validFiles = xlsFiles.length ? xlsFiles : files; // 필터 실패 시 전체 처리
  if (!validFiles.length) return;

  let pending = validFiles.length;
  let incoming = [];

  validFiles.forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => {
      const wb = XLSX.read(ev.target.result, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

      rows.forEach(row => {
        // 날짜 컬럼
        const rawDate = row['주문기준일자'] || row['날짜'] || row['주문일'] || '';
        let dateStr = '';
        if (rawDate instanceof Date) {
          dateStr = rawDate.toISOString().slice(0, 10);
        } else {
          dateStr = String(rawDate).trim().slice(0, 10);
        }

        // 제품명
        const name = String(row['상품명'] || row['제품명'] || '').trim();

        // 수량
        const qty = Math.max(1, parseInt(row['수량'] || 1) || 1);

        // 판매금액 — 컬럼명에 줄바꿈 포함될 수 있으므로 모든 키를 탐색
        // 마이너스 부호 보존 (환불/취소 행 처리)
        let salePrice = 0;
        for (const k of Object.keys(row)) {
          if (k.includes('실판매금액') || k.includes('판매금액') || k.includes('금액')) {
            const raw  = String(row[k]).trim();
            const sign = raw.startsWith('-') ? -1 : 1;
            const v    = raw.replace(/[^\d]/g, '');
            if (v) { salePrice = sign * (parseInt(v) || 0); break; }
          }
        }

        if (dateStr && name && salePrice !== 0) {
          incoming.push({ date: dateStr, name, qty, salePrice, cost: 0, margin: salePrice, matched: false, source: 'pos' });
        }
      });

      pending--;
      if (pending === 0) finalize(incoming);
    };
    reader.readAsArrayBuffer(file);
  });
}

document.getElementById('fileIn').addEventListener('change', function(e) {
  const files = Array.from(e.target.files);
  processFiles(files);
  this.value = '';
});

/* ═══════════ DRAG & DROP ═══════════ */
(function setupDragDrop() {
  const overlay = document.getElementById('dragOverlay');
  let dragCounter = 0;

  document.addEventListener('dragenter', function(e) {
    e.preventDefault();
    dragCounter++;
    overlay.classList.add('visible');
  });
  document.addEventListener('dragleave', function(e) {
    dragCounter--;
    if (dragCounter <= 0) { dragCounter = 0; overlay.classList.remove('visible'); }
  });
  document.addEventListener('dragover', function(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  });
  document.addEventListener('drop', function(e) {
    e.preventDefault();
    dragCounter = 0;
    overlay.classList.remove('visible');
    const files = Array.from(e.dataTransfer.files);
    processFiles(files);
  });
})();

function finalize(incoming) {
  // 업로드된 파일에 포함된 날짜는 통째로 교체 (삭제 항목도 반영됨)
  const incomingDates = new Set(incoming.map(r => r.date));
  // 날짜 형식 정규화: YYYY-MM-DD 로 통일
  const normDate = s => String(s || '').trim().slice(0, 10);
  const normIncomingDates = new Set(incoming.map(r => normDate(r.date)));
  const preserved = posRows.filter(r => !normIncomingDates.has(normDate(r.date)));
  const prevCount = posRows.length;
  posRows = [...preserved, ...incoming];

  const el = document.getElementById('posStatus');
  const dateList = [...normIncomingDates].sort().join(', ');
  el.textContent = `✅ ${posRows.length}건 로드됨 (교체된 날짜: ${dateList})`;
  el.className = 'pos-status ok';

  // Firebase에 누적 저장
  try {
    const db = firebase.database();
    const storeCode = localStorage.getItem('ws_store_code') || 'store1';
    db.ref('pos_rows/' + storeCode).set(posRows.map(r => ({
      date: r.date, name: r.name, qty: r.qty,
      salePrice: r.salePrice, source: r.source || 'pos'
    })));
  } catch(e) {}

  matchCosts();
}

/* ═══════════ COST MATCHING ═══════════ */

// 와인명 한글 표기 통일 (같은 품종의 다른 표기 → 동일하게)
function normSynonyms(s) {
  return s
    .replace(/샤도네이/g,  '샤르도네')  // Chardonnay: 샤도네이 → 샤르도네
    .replace(/샤도네/g,    '샤르도네')  // 샤도네 → 샤르도네
    .replace(/까베르네/g,  '카베르네')  // Cabernet: 까 → 카
    .replace(/까쇼/g,      '카쇼')     // Cashew 식 표기
    .replace(/삐노/g,      '피노')     // Pinot: 삐노 → 피노
    .replace(/뮤스캣/g,    '뮈스카')   // Muscat
    .replace(/뮤스카/g,    '뮈스카');
}

// Firebase key로 사용 가능한 안전한 키 생성 (. / [ ] # $ 제거)
function customCostKey(posName) {
  return normName(posName)
    .replace(/[./#[\]$]/g, '')
    .replace(/\s+/g, '_')
    .slice(0, 120);              // Firebase key 최대 길이 제한
}

// 제품명 정규화: 소문자, 공백 정리, [접두사] 제거
function normName(s) {
  return normSynonyms(
    s.trim()
      .toLowerCase()
      .replace(/\[.*?\]\s*/g, '')   // [gift set], [단품] 등 제거
      .replace(/\//g, ' ')          // 슬래시 → 공백 (딸기/살구/초코 처리)
      .replace(/,\s*/g, ' ')        // 쉼표 → 공백 (비네롱 드 뷕시, 꼬뜨... 처리)
      .replace(/\s+/g, ' ')
      .trim()
  );
}

// 용량 표기 제거 (750ml, 50ml, 미니 등) — 아구아 50ml ↔ 아구아 미니 매칭용
function stripSize(s) {
  return s
    .replace(/\b\d+\s*ml\b/gi, '')  // 750ml, 375ml, 50ml
    .replace(/\b\d+\s*cl\b/gi, '')  // 75cl
    .replace(/\b미니\b/g, '')
    .replace(/\b라지\b/g, '')
    .replace(/\b스몰\b/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

// 빈티지 연도 제거 ('22, 2022, ,2019 등)
function stripYear(s) {
  return s
    .replace(/,?\s*'?\d{4}$/,  '')   // 끝의 2022, '22 등
    .replace(/,?\s*20\d{2}$/,  '')   // 끝의 2022 형식
    .replace(/\s+'?\d{2}$/,    '')   // 끝의 '22 형식
    .replace(/\s+\d{4}\b/g,    '')   // 중간의 2022 형식
    .replace(/\s+/g, ' ')
    .trim();
}

// 가격·비제품 행인지 확인 (1,000 / 물품 등)
function isNonProduct(name) {
  const t = name.trim();
  if (/^[\d,]+$/.test(t)) return true;  // 가격만: 1,000 / 5,000
  if (t === '물품') return true;          // 비품
  return false;
  // ※ ml 포함 항목(봄베이 750ml, 잭다니엘 375ml 등)은 정품이므로 필터 제거
}

// 편집 거리 유사도 (오타 보정용 — 클↔크, 스↔즈 등 1~2자 차이 처리, 0~1)
function editSim(a, b) {
  if (!a || !b) return 0;
  const m = a.length, n = b.length;
  if (Math.abs(m - n) > 3) return 0; // 길이 차 너무 크면 스킵
  const prev = Array.from({length: n + 1}, (_, i) => i);
  const cur  = Array(n + 1).fill(0);
  for (let i = 1; i <= m; i++) {
    cur[0] = i;
    for (let j = 1; j <= n; j++) {
      cur[j] = a[i-1] === b[j-1] ? prev[j-1]
             : 1 + Math.min(prev[j], cur[j-1], prev[j-1]);
    }
    prev.splice(0, n + 1, ...cur);
  }
  return 1 - prev[n] / Math.max(m, n);
}

// 스마트 제품 탐색
function findProductSmart(posName) {
  if (isNonProduct(posName)) return null;

  const norm = normName(posName);
  const normNoYear = stripYear(norm);

  // 1단계: 정확히 일치
  for (const p of products) {
    if (normName(p.name) === norm) return p;
  }

  // 1.5단계: 띄어쓰기 무시 후 일치
  // 예) POS "페퍼잭" ↔ Firebase "페퍼 잭" / POS "스토니리버" ↔ Firebase "스토니 리버"
  const normNoSp = norm.replace(/\s/g, '');
  const normNoYearNoSp = normNoYear.replace(/\s/g, '');
  for (const p of products) {
    const pn = normName(p.name);
    const pnNoSp = pn.replace(/\s/g, '');
    const pnNoYearNoSp = stripYear(pn).replace(/\s/g, '');
    if (pnNoSp === normNoSp) return p;
    if (pnNoYearNoSp === normNoYearNoSp && normNoYearNoSp.length > 2) return p;
  }

  // 1.7단계: 앞부분 일치 (POS 이름이 Firebase 이름의 시작 부분일 때)
  // 예) "찰스하이직" → "찰스하이직리저브브뤼" 앞부분 포함
  if (normNoSp.length >= 4) {
    for (const p of products) {
      const pnNoSp = normName(p.name).replace(/\s/g, '');
      if (pnNoSp.startsWith(normNoSp)) return p;
    }
  }
  if (normNoYearNoSp.length >= 4) {
    for (const p of products) {
      const pnNoYearNoSp = stripYear(normName(p.name)).replace(/\s/g, '');
      if (pnNoYearNoSp.startsWith(normNoYearNoSp)) return p;
    }
  }

  // 2단계: 빈티지 제거 후 일치
  for (const p of products) {
    const pn = normName(p.name);
    if (stripYear(pn) === normNoYear && normNoYear.length > 2) return p;
  }

  // 2.5단계: 용량 표기 제거 후 일치 (아구아 50ml ↔ 아구아 미니)
  const normSz    = stripSize(norm);
  const normSzNY  = stripSize(normNoYear);
  if (normSz.length >= 2) {
    for (const p of products) {
      const pn   = normName(p.name);
      const pnSz = stripSize(pn);
      if (pnSz === normSz) return p;
      if (normSzNY.length >= 2 && stripSize(stripYear(pn)) === normSzNY) return p;
    }
  }

  // 3단계: 포함 관계 (한글은 2글자 이상이면 유효)
  for (const p of products) {
    const pn = normName(p.name);
    const pnNoYear = stripYear(pn);
    if (norm.length >= 2 && (pn.includes(norm) || norm.includes(pn))) return p;
    if (normNoYear.length >= 2 && (pnNoYear.includes(normNoYear) || normNoYear.includes(pnNoYear))) return p;
  }

  // 4단계: POS의 모든 단어가 Firebase 이름 안에 포함 (또는 역방향)
  // 예) "스토니 리버" → "스토니 리버 까베르네 소비뇽 '22" / "아마로네 발폴리첼라" → "꼰떼 … 아마로네 … 발폴리첼라"
  const posWords = norm.split(' ').filter(w => w.length >= 2);
  if (posWords.length > 0) {
    for (const p of products) {
      const pn = normName(p.name);
      if (posWords.every(w => pn.includes(w))) return p;  // POS 단어 모두 FB에 포함
    }
    for (const p of products) {
      const pnNoYear = stripYear(normName(p.name));
      if (posWords.every(w => pnNoYear.includes(w))) return p;
    }
    // 역방향: Firebase의 모든 단어가 POS 이름 안에 포함 (짧은 FB 이름 → 긴 POS 이름)
    for (const p of products) {
      const fbWords = normName(p.name).split(' ').filter(w => w.length >= 2);
      if (fbWords.length >= 2 && fbWords.every(w => norm.includes(w))) return p;
    }
    for (const p of products) {
      const fbWords = stripYear(normName(p.name)).split(' ').filter(w => w.length >= 2);
      if (fbWords.length >= 2 && fbWords.every(w => normNoYear.includes(w))) return p;
    }
  }

  // 5단계: 단어 겹침 비율 (4단어 이상 긴 이름은 0.5, 나머지 0.6)
  if (posWords.length === 0) return null;
  const posSet = new Set(posWords);
  const longName = posWords.length >= 4;

  let best = null, bestScore = 0;
  for (const p of products) {
    const pWords = normName(p.name).split(' ').filter(w => w.length >= 2);
    const overlap = pWords.filter(w => posSet.has(w)).length;
    const score = overlap / Math.max(posSet.size, pWords.length);
    const threshold = longName ? 0.5 : 0.6;
    if (score > bestScore && score >= threshold) {
      bestScore = score; best = p;
    }
  }
  if (best) return best;

  // 6단계: 편집 거리 유사도 (오타 보정 — 클↔크, 스↔즈 등 1~2자 차이)
  // 공백 제거 후 유사도 ≥0.78 이면 매칭
  let bestSim = null, bestSimScore = 0;
  for (const p of products) {
    const pnNS = normName(p.name).replace(/\s/g, '');
    const s1 = editSim(normNoSp, pnNS);
    if (s1 > bestSimScore && s1 >= 0.78) { bestSimScore = s1; bestSim = p; }
    const pnNYNS = stripYear(normName(p.name)).replace(/\s/g, '');
    const s2 = editSim(normNoYearNoSp, pnNYNS);
    if (s2 > bestSimScore && s2 >= 0.78) { bestSimScore = s2; bestSim = p; }
  }
  return bestSim;
}

/* ═══════════ SETTLE — Firebase 저장 함수들 ═══════════ */

function loadPayTotals(db, storeCode) {
  if (!db) return;
  const safeMonth = filterMonth.replace('-', '_');
  db.ref('store_settings/' + storeCode + '/pay_totals/' + safeMonth)
    .once('value').then(snap => {
      const d = snap.val();
      if (d) payTotals = d;
      if (activeTab === 'settle') renderSettle();
    });
}

function savePayTotals() {
  try {
    const storeCode = localStorage.getItem('ws_store_code') || 'store1';
    const safeMonth = filterMonth.replace('-', '_');
    firebase.database()
      .ref('store_settings/' + storeCode + '/pay_totals/' + safeMonth)
      .set(payTotals);
  } catch(e) {}
}

function saveFeeRates() {
  try {
    const storeCode = localStorage.getItem('ws_store_code') || 'store1';
    firebase.database()
      .ref('store_settings/' + storeCode + '/fee_rates')
      .set(feeRates);
  } catch(e) {}
}

function addExpense() {
  const id = 'exp_' + Date.now();
  const name = prompt('지출 항목명을 입력하세요 (예: 임대료, 인건비)', '');
  if (!name) return;
  // 항목명만 저장 (금액은 월별로 따로 입력)
  try {
    const storeCode = localStorage.getItem('ws_store_code') || 'store1';
    firebase.database()
      .ref('store_settings/' + storeCode + '/fixed_expenses/' + id)
      .set({ name, order: Date.now() });
  } catch(e) {}
}

function deleteExpense(id) {
  if (!confirm('이 항목을 삭제할까요?')) return;
  try {
    const storeCode = localStorage.getItem('ws_store_code') || 'store1';
    firebase.database()
      .ref('store_settings/' + storeCode + '/fixed_expenses/' + id)
      .remove();
  } catch(e) {}
}

function updateExpenseAmount(id, val) {
  const amount = parseInt(String(val).replace(/[^\d]/g, '')) || 0;
  expenseAmounts[id] = amount;
  try {
    const storeCode = localStorage.getItem('ws_store_code') || 'store1';
    const safeMonth = filterMonth.replace('-', '_');
    firebase.database()
      .ref('store_settings/' + storeCode + '/expense_amounts/' + safeMonth + '/' + id)
      .set(amount);
  } catch(e) {}
}

function loadExpenseAmounts(db, storeCode) {
  if (!db) return;
  const safeMonth = filterMonth.replace('-', '_');
  db.ref('store_settings/' + storeCode + '/expense_amounts/' + safeMonth)
    .once('value').then(snap => {
      expenseAmounts = snap.val() || {};
      if (activeTab === 'settle') renderSettle();
    });
}

function saveRefItems() {
  try {
    const storeCode = localStorage.getItem('ws_store_code') || 'store1';
    firebase.database()
      .ref('store_settings/' + storeCode + '/ref_items')
      .set(refItems);
  } catch(e) {}
}

/* ── 정산 탭 렌더 ── */
function renderSettle() {
  const panel = document.getElementById('panel-settle');
  const rows  = getRows();
  const totalRevenue = rows.reduce((s, r) => s + (r.salePrice || 0), 0);
  const totalMargin  = rows.reduce((s, r) => s + (r.margin   || 0), 0);

  // 수수료 계산
  const cardFee = Math.round(payTotals.card * feeRates.card / 100);
  const easyFee = Math.round(payTotals.easy * feeRates.easy / 100);
  const totalFees = cardFee + easyFee;

  // 고정지출
  const expList = Object.entries(fixedExpenses)
    .sort((a, b) => (a[1].order || 0) - (b[1].order || 0));
  const totalFixed = expList.reduce((s, [id]) => s + (expenseAmounts[id] || 0), 0);

  // 순수익 (수수료 + 고정지출 합산)
  const totalDeductions = totalFees + totalFixed;
  const netProfit = totalMargin - totalDeductions;

  const feeRows = [
    { key: 'card', label: '💳 카드', rateKey: 'card', val: payTotals.card, fee: cardFee },
    { key: 'easy', label: '📱 간편결제', rateKey: 'easy', val: payTotals.easy, fee: easyFee },
  ];

  const feeRowsHtml = feeRows.map(f => `
    <div class="fee-row">
      <span class="fee-label">${f.label}</span>
      <input class="settle-input" type="number" min="0" step="1000"
             value="${f.val || ''}" placeholder="매출액 (원)"
             onchange="payTotals.${f.key}=parseInt(this.value.replace(/[^\\d]/g,''))||0; savePayTotals(); renderSettle()">
      <span class="fee-arrow">× </span>
      <input class="settle-input settle-input-rate" type="number" min="0" max="10" step="0.1"
             value="${feeRates[f.rateKey]}"
             onchange="feeRates.${f.rateKey}=parseFloat(this.value)||0; saveFeeRates(); renderSettle()">
      <span class="fee-arrow">%</span>
      <span class="fee-result">= ${won(f.fee)}</span>
    </div>`).join('') + `
    <div class="fee-row" style="opacity:.85">
      <span class="fee-label">🧾 현금영수증</span>
      <input class="settle-input" type="number" min="0" step="1000"
             value="${payTotals.cashReceipt || ''}" placeholder="금액 (원)"
             onchange="payTotals.cashReceipt=parseInt(this.value.replace(/[^\\d]/g,''))||0; savePayTotals();">
      <span class="fee-arrow" style="font-size:11px;color:var(--text-3)">수수료 없음</span>
    </div>`;

  const expRowsHtml = expList.map(([id, e]) => `
    <div class="expense-row">
      <span class="expense-name" style="font-size:13px">${e.name}</span>
      <input class="settle-input" type="number" min="0" step="10000"
             value="${expenseAmounts[id] || ''}" placeholder="금액 (원)"
             onchange="updateExpenseAmount('${id}', this.value)">
      <button class="expense-del" onclick="deleteExpense('${id}')" title="삭제">×</button>
    </div>`).join('');

  // 수수료를 고정지출 섹션 안에 자동 항목으로 표시
  const autoFeeRowsHtml = [
    { label: '💳 카드 수수료', fee: cardFee },
    { label: '📱 간편결제 수수료', fee: easyFee },
  ].filter(f => f.fee > 0).map(f => `
    <div class="expense-row" style="opacity:.75">
      <span class="expense-name" style="font-size:13px;color:var(--text-2)">${f.label} <span style="font-size:11px;color:var(--text-3)">(자동)</span></span>
      <span style="font-size:13px;font-weight:500;color:var(--warn)">${won(f.fee)}</span>
    </div>`).join('');

  panel.innerHTML = `
    <div class="net-box">
      <div class="net-box-label">이달 순수익 (${filterMonth})</div>
      <div class="net-box-formula">
        총 마진 ${won(totalMargin)}<br>
        − 고정지출 합계 ${won(totalDeductions)}
      </div>
      <div class="net-box-val${netProfit < 0 ? ' neg' : ''}">${won(netProfit)}</div>
    </div>

    <div class="settle-section">
      <div class="settle-title">💳 결제수단별 수수료 정산</div>
      ${feeRowsHtml}
      <div class="settle-sub">수수료 합계 <span class="sub-val">${won(totalFees)}</span></div>
    </div>

    <div class="settle-section">
      <div class="settle-title">🏠 고정지출</div>
      ${autoFeeRowsHtml}
      ${expRowsHtml || (!autoFeeRowsHtml ? '<p style="font-size:12px;color:var(--text-3);padding:8px 0">아직 항목이 없어요</p>' : '')}
      <button class="add-expense-btn" onclick="addExpense()">+ 항목 추가</button>
      <div class="settle-sub">고정지출 합계 <span class="sub-val">${won(totalDeductions)}</span></div>
    </div>

    <div class="settle-section" style="font-size:12px;color:var(--text-2);line-height:1.8">
      <div class="settle-title">📊 매출 요약</div>
      <div style="display:flex;justify-content:space-between"><span>총 매출</span><b style="color:var(--text)">${won(totalRevenue)}</b></div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span>총 원가 ${unmatchedSet.size > 0 ? `<span style="color:var(--warn);font-size:11px">(미확인 ${unmatchedSet.size}개 포함)</span>` : ''}</span>
        <b style="color:var(--text)">${won(totalRevenue - totalMargin)}</b>
      </div>
      <div style="display:flex;justify-content:space-between"><span>총 마진</span><b style="color:var(--success)">${won(totalMargin)}</b></div>
      ${unmatchedSet.size > 0 ? `
      <div style="margin-top:8px;padding:10px 12px;background:var(--warn-bg);border-radius:var(--r-sm);border-left:3px solid var(--warn)">
        <div style="color:var(--warn);font-weight:600;margin-bottom:6px;font-size:12px">⚠️ 원가 미확인 ${unmatchedSet.size}개 — 제품별 탭에서 ✎ 눌러 수정하세요</div>
        ${[...unmatchedSet].slice(0,5).map(name => {
          const safeJson = JSON.stringify(name);
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 0">
            <span style="color:var(--text-2);font-size:12px">${name}</span>
            <button class="cost-edit-btn" style="font-size:13px;padding:3px 8px;border:1px solid var(--border);border-radius:4px" onclick="openCostEditor(${safeJson})">✎ 수정</button>
          </div>`;
        }).join('')}
        ${unmatchedSet.size > 5 ? `<div style="color:var(--text-3);font-size:11px;margin-top:4px">외 ${unmatchedSet.size-5}개 더...</div>` : ''}
      </div>` : ''}
    </div>

    ${renderVatSection(totalRevenue, totalRevenue - totalMargin)}

    <div class="settle-section">
      <div class="settle-title" style="display:flex;align-items:center;gap:8px">
        📋 참고 항목
        <span style="font-size:11px;font-weight:400;color:var(--text-3);background:var(--surface-2);padding:2px 8px;border-radius:20px">순수익 계산 미포함</span>
      </div>
      <p style="font-size:11px;color:var(--text-3);margin-bottom:10px">금액을 기록해두는 용도로만 사용해요.</p>
      <div class="fee-row">
        <span class="fee-label">🏷️ 매매대금</span>
        <input class="settle-input" type="number" min="0" step="10000"
               value="${refItems.trade || ''}" placeholder="금액 (원)"
               onchange="refItems.trade=parseInt(this.value.replace(/[^\\d]/g,''))||0; saveRefItems()">
        <span class="fee-arrow" style="color:var(--text-3);font-size:12px">${refItems.trade ? won(refItems.trade) : ''}</span>
      </div>
      <div class="fee-row">
        <span class="fee-label">🛒 코스트코 금액</span>
        <input class="settle-input" type="number" min="0" step="10000"
               value="${refItems.costco || ''}" placeholder="금액 (원)"
               onchange="refItems.costco=parseInt(this.value.replace(/[^\\d]/g,''))||0; saveRefItems()">
        <span class="fee-arrow" style="color:var(--text-3);font-size:12px">${refItems.costco ? won(refItems.costco) : ''}</span>
      </div>
      ${(refItems.trade || refItems.costco) ? `
      <div class="settle-sub" style="color:var(--text-2)">
        참고 합계 <span style="color:var(--text)">${won((refItems.trade||0) + (refItems.costco||0))}</span>
      </div>` : ''}
    </div>
  `;
}

/* ── 부가세 섹션 ── */
function renderVatSection(totalRevenue, totalCost) {
  // 판매가 부가세 포함 기준: VAT = 금액 × 10/110
  const outputVat  = Math.round(totalRevenue * 10 / 110);   // 매출 부가세 (납부)
  const inputVat   = Math.round(totalCost    * 10 / 110);   // 매입 부가세 (공제)
  const vatPayable = Math.max(0, outputVat - inputVat);      // 납부할 부가세 (음수 방지)
  const vatRefund  = inputVat > outputVat ? inputVat - outputVat : 0; // 환급액

  const vatColor  = vatRefund > 0 ? 'var(--success)' : 'var(--warn)';
  const vatLabel  = vatRefund > 0 ? '🎉 환급 예상' : '📌 납부 예상 부가세';
  const vatAmount = vatRefund > 0 ? vatRefund : vatPayable;

  if (!totalRevenue) return '';

  return `
  <div class="settle-section vat-section">
    <div class="settle-title">🧾 부가세 예상
      <span style="font-size:11px;font-weight:400;color:var(--text-3);background:var(--surface-2);padding:2px 8px;border-radius:20px;margin-left:6px">부가세 포함 기준</span>
    </div>
    <div class="vat-grid">
      <div class="vat-row">
        <span class="vat-label">매출 부가세 <span class="vat-hint">(납부)</span></span>
        <span class="vat-val warn">${won(outputVat)}</span>
      </div>
      <div class="vat-row">
        <span class="vat-label">매입 부가세 <span class="vat-hint">(공제)</span></span>
        <span class="vat-val ok">− ${won(inputVat)}</span>
      </div>
      <div class="vat-divider"></div>
      <div class="vat-row vat-total">
        <span class="vat-label">${vatLabel}</span>
        <span class="vat-val" style="color:${vatColor};font-size:16px;font-weight:700">${won(vatAmount)}</span>
      </div>
    </div>
    <p class="vat-note">※ POS 매출·원가 기준 추정값이에요. 실제 신고 시 세무사·홈택스와 반드시 확인하세요.</p>
  </div>`;
}

// 사용자 입력 원가를 Firebase에 저장
/* ═══════════ COST EDITOR MODAL ═══════════ */
let _costEditorName = '';
function openCostEditor(name, currentUnitCost, avgSalePrice) {
  _costEditorName = name;
  const key = customCostKey(name);
  const customVal = customCosts[key] || 0;
  // 가격표에서도 원가 탐색 (customVal도 currentUnitCost도 없을 때 참고용)
  let priceListCost = 0;
  if (!customVal && !currentUnitCost) {
    const p = findProductSmart(name);
    if (p && p.cost) priceListCost = p.cost;
  }
  const displayCost = customVal || currentUnitCost || priceListCost || 0;
  document.getElementById('costEditorName').textContent = name;
  const inp = document.getElementById('costEditorInput');
  inp.value = displayCost || '';
  inp.placeholder = displayCost ? won(displayCost) : '원가 (원)';
  // 평균 판매가 힌트 표시
  const hintEl = document.getElementById('costEditorHint');
  if (hintEl) {
    hintEl.textContent = avgSalePrice
      ? `판매단가 평균 ${won(avgSalePrice)} · 1개당 원가 입력`
      : '판매 단가 기준 1개당 원가';
  }
  document.getElementById('costEditorOk').style.display = 'none';
  document.getElementById('costEditorModal').classList.add('open');
  setTimeout(() => { inp.focus(); inp.select(); }, 100);
}
function closeCostEditor() {
  document.getElementById('costEditorModal').classList.remove('open');
}
function saveCostFromEditor() {
  const inp = document.getElementById('costEditorInput');
  const ok  = document.getElementById('costEditorOk');
  const cost = parseInt(String(inp.value).replace(/[^\d]/g, '')) || 0;
  const key  = customCostKey(_costEditorName);
  try {
    firebase.database().ref('pos_custom_costs/' + key).set(cost)
      .then(() => {
        customCosts[key] = cost;
        ok.style.display = 'block';
        render();
        setTimeout(() => { closeCostEditor(); }, 800);
      })
      .catch(e => alert('저장 실패: ' + e.message));
  } catch(e) {
    console.warn('saveCostFromEditor error:', e);
  }
}

function saveCustomCost(posName, inputEl, savedEl) {
  const cost = parseInt(String(inputEl.value).replace(/[^\d]/g, '')) || 0;
  const key  = customCostKey(posName);
  try {
    firebase.database().ref('pos_custom_costs/' + key).set(cost)
      .then(() => {
        if (savedEl) {
          savedEl.style.display = 'inline';
          setTimeout(() => { savedEl.style.display = 'none'; }, 2500);
        }
        // customCosts listener가 자동으로 matchCosts() 재실행
      })
      .catch(err => alert('저장 실패: ' + err.message));
  } catch(e) {
    console.warn('saveCustomCost error:', e);
  }
}

// 가격표 수동 새로고침 (Firebase에서 최신 원가 다시 불러와 재계산)
function refreshProducts() {
  const btn = document.getElementById('refreshBtn');
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = '⏳ 불러오는 중...';
  try {
    const db = firebase.database();
    db.ref('products').once('value').then(snap => {
      const d = snap.val();
      if (d && d.list && d.list.length) {
        products = d.list;
        if (posRows.length) matchCosts();
        btn.textContent = '✓ 업데이트 완료';
        setTimeout(() => { btn.textContent = '↻ 원가 새로고침'; btn.disabled = false; }, 2000);
      } else {
        btn.textContent = '↻ 원가 새로고침'; btn.disabled = false;
      }
    }).catch(() => { btn.textContent = '↻ 원가 새로고침'; btn.disabled = false; });
  } catch(e) {
    btn.textContent = '↻ 원가 새로고침'; btn.disabled = false;
  }
}

function matchCosts() {
  unmatchedSet.clear();

  posRows.forEach(r => {
    // 비제품 행은 건너뜀 (가격, 물품 등)
    if (isNonProduct(r.name)) {
      r.cost = 0; r.margin = r.salePrice; r.matched = true; r.isPrice = true;
      return;
    }

    // ① 사용자가 직접 입력한 원가 우선 적용
    const key = customCostKey(r.name);
    if (customCosts[key] !== undefined) {
      r.cost       = customCosts[key] * r.qty;
      r.margin     = r.salePrice - r.cost;
      r.matched    = true;
      r.isCustom   = true;
      r.matchedName = null;
      return;
    }

    // ② 알고리즘 자동 매칭
    const p = findProductSmart(r.name);
    if (p) {
      r.cost      = (p.cost || 0) * r.qty;
      r.margin    = r.salePrice - r.cost;
      r.matched   = true;
      r.isCustom  = false;
      r.matchedName = p.name;
    } else {
      r.cost      = 0;
      r.margin    = r.salePrice;
      r.matched   = false;
      r.isCustom  = false;
      unmatchedSet.add(r.name);
    }
  });

  render();
}

/* ═══════════ FILTERED DATA ═══════════ */
function getRows() {
  const m = filterMonth;

  const pos = posRows.filter(r => r.date.startsWith(m));

  // Flatten cash sales → item-level rows
  const cashItems = [];
  cashRaw
    .filter(s => s.date && s.date.startsWith(m))
    .forEach(sale => {
      const items    = sale.items || [];
      const discount = sale.discount || 0;
      const subTotal = items.reduce((s, i) => s + (i.price || 0) * (i.qty || 1), 0);

      items.forEach(item => {
        const raw     = (item.price || 0) * (item.qty || 1);
        const disc    = subTotal > 0 ? Math.round(discount * raw / subTotal) : 0;
        const revenue = Math.max(0, raw - disc);
        const cost    = (item.cost || 0) * (item.qty || 1);
        cashItems.push({
          date:      sale.date,
          name:      item.name,
          qty:       item.qty || 1,
          salePrice: revenue,
          cost,
          margin:    revenue - cost,
          matched:   true,
          source:    'cash',
          pay:       sale.pay,
          bank:      sale.bank || ''
        });
      });
    });

  if (activeSource === 'pos')  return pos;
  if (activeSource === 'cash') return cashItems;
  return [...pos, ...cashItems];
}

/* ═══════════ HELPERS ═══════════ */
const won = n => '₩' + Math.round(n || 0).toLocaleString('ko-KR');
const pct = (a, b) => b > 0 ? ((a / b) * 100).toFixed(1) + '%' : '—';

/* ═══════════ RENDER ═══════════ */
function render() {
  const rows = getRows();
  renderStats(rows);
  if      (activeTab === 'date')    renderDate(rows);
  else if (activeTab === 'product') renderProduct(rows);
  else if (activeTab === 'settle')  renderSettle();
  else                              renderDetail(rows);
}

/* ── Stats ── */
function renderStats(rows) {
  const total  = rows.reduce((s, r) => s + (r.salePrice || 0), 0);
  const cost   = rows.reduce((s, r) => s + (r.cost   || 0), 0);
  const margin = rows.reduce((s, r) => s + (r.margin || 0), 0);
  const rate   = total > 0 ? (margin / total * 100) : 0;

  document.getElementById('st-total') .textContent = total  ? won(total)  : '—';
  document.getElementById('st-cost')  .textContent = cost   ? won(cost)   : '—';
  document.getElementById('st-margin').textContent = margin ? won(margin) : '—';
  document.getElementById('st-rate')  .textContent = total  ? rate.toFixed(1) + '%' : '—';
  document.getElementById('rateBar').style.width = Math.min(100, rate) + '%';
}

/* ── Date view ── */
function renderDate(rows) {
  const panel = document.getElementById('panel-date');
  if (!rows.length) { panel.innerHTML = emptyHtml(); return; }

  const map = {};
  rows.forEach(r => {
    if (!map[r.date]) map[r.date] = { total: 0, cost: 0, margin: 0, cnt: 0 };
    const d = map[r.date];
    d.total  += r.salePrice; d.cost += r.cost; d.margin += r.margin; d.cnt++;
  });

  const dates  = Object.keys(map).sort().reverse();
  const maxRate = Math.max(...dates.map(d => map[d].total > 0 ? map[d].margin / map[d].total : 0), .001);

  const warn = buildWarnBanner();

  const body = dates.map(d => {
    const v = map[d];
    const rate  = v.total > 0 ? v.margin / v.total : 0;
    const barW  = ((rate / maxRate) * 100).toFixed(0);
    const dow   = ['일','월','화','수','목','금','토'][new Date(d).getDay()];
    return `<tr>
      <td><b>${d}</b> <span class="col-muted">(${dow})</span></td>
      <td class="hide-xs">${v.cnt}</td>
      <td>${won(v.total)}</td>
      <td class="hide-xs">${won(v.cost)}</td>
      <td class="col-green">${won(v.margin)}</td>
      <td>
        <div class="mbar-cell">
          ${pct(v.margin, v.total)}
          <div class="mbar"><div class="mbar-fill" style="width:${barW}%"></div></div>
        </div>
      </td>
    </tr>`;
  }).join('');

  const tt = rows.reduce((s,r)=>s+r.salePrice,0);
  const tc = rows.reduce((s,r)=>s+r.cost,0);
  const tm = rows.reduce((s,r)=>s+r.margin,0);

  panel.innerHTML = warn + `<div class="tbl-wrap"><table class="tbl">
    <thead><tr>
      <th>날짜</th><th class="hide-xs">건수</th>
      <th>매출</th><th class="hide-xs">원가</th>
      <th>마진</th><th>마진율</th>
    </tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr class="total-row">
      <td>합계</td>
      <td class="hide-xs">${rows.length}</td>
      <td>${won(tt)}</td><td class="hide-xs">${won(tc)}</td>
      <td class="col-green">${won(tm)}</td>
      <td>${pct(tm,tt)}</td>
    </tr></tfoot>
  </table></div>`;
}

/* ── Product view ── */
function sortProducts(key) {
  if (productSort.key === key) {
    productSort.dir = productSort.dir === 'desc' ? 'asc' : 'desc';
  } else {
    productSort.key = key;
    productSort.dir = 'desc';
  }
  render();
}

function renderProduct(rows) {
  const panel = document.getElementById('panel-product');
  if (!rows.length) { panel.innerHTML = emptyHtml(); return; }

  const map = {};
  rows.forEach(r => {
    if (!map[r.name]) map[r.name] = { total:0, cost:0, margin:0, qty:0, matched:r.matched, isCustom: !!r.isCustom };
    const d = map[r.name];
    d.total += r.salePrice; d.cost += r.cost; d.margin += r.margin; d.qty += r.qty;
    if (!r.matched) d.matched = false;
    if (r.isCustom) d.isCustom = true;
  });

  // 정렬
  const sortFn = {
    name:    (a, b) => a[0].localeCompare(b[0]),
    qty:     (a, b) => a[1].qty - b[1].qty,
    total:   (a, b) => a[1].total - b[1].total,
    cost:    (a, b) => a[1].cost - b[1].cost,
    margin:  (a, b) => a[1].margin - b[1].margin,
    rate:    (a, b) => (a[1].total ? a[1].margin/a[1].total : 0) - (b[1].total ? b[1].margin/b[1].total : 0),
  };
  const fn = sortFn[productSort.key] || sortFn.margin;
  const prods = Object.entries(map).sort((a, b) => productSort.dir === 'desc' ? fn(b, a) : fn(a, b));

  const tt = rows.reduce((s,r)=>s+r.salePrice,0);
  const tc = rows.reduce((s,r)=>s+r.cost,0);
  const tm = rows.reduce((s,r)=>s+r.margin,0);

  // 헤더 정렬 표시
  const arrow = (key) => {
    if (productSort.key !== key) return '<span class="sort-arrow inactive">↕</span>';
    return `<span class="sort-arrow">${productSort.dir === 'desc' ? '↓' : '↑'}</span>`;
  };

  const body = prods.map(([name, v]) => {
    const unitCost = v.qty ? Math.round(v.cost / v.qty) : 0;
    const avgSale  = v.qty ? Math.round(v.total / v.qty) : 0;
    const safeJson = JSON.stringify(name);
    const editBtn = `<button class="cost-edit-btn" onclick="openCostEditor(${safeJson},${unitCost},${avgSale})">✎ 원가</button>`;
    let costCol;
    if (!v.matched) {
      costCol = `<span class="col-warn" style="font-size:11px">미확인</span>`;
    } else {
      costCol = won(v.cost);
    }
    const costDisplay = !v.matched ? `<span class="col-warn" style="font-size:11px">미확인</span>` : won(v.cost);
    return `<tr>
      <td>${name} ${editBtn}</td>
      <td>${v.qty}</td>
      <td>${won(v.total)}</td>
      <td class="hide-xs">${costDisplay}</td>
      <td class="col-green">${won(v.margin)}</td>
      <td>${pct(v.margin, v.total)}</td>
    </tr>`;
  }).join('');

  const warn = buildWarnBanner();
  panel.innerHTML = warn + `<div class="tbl-wrap"><table class="tbl">
    <thead><tr>
      <th class="sort-th" onclick="sortProducts('name')">제품명 ${arrow('name')}</th>
      <th class="sort-th" onclick="sortProducts('qty')">수량 ${arrow('qty')}</th>
      <th class="sort-th" onclick="sortProducts('total')">매출 ${arrow('total')}</th>
      <th class="sort-th hide-xs" onclick="sortProducts('cost')">원가 ${arrow('cost')}</th>
      <th class="sort-th" onclick="sortProducts('margin')">마진 ${arrow('margin')}</th>
      <th class="sort-th" onclick="sortProducts('rate')">마진율 ${arrow('rate')}</th>
    </tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr class="total-row">
      <td>${prods.length}종</td>
      <td>${rows.reduce((s,r)=>s+r.qty,0)}</td>
      <td>${won(tt)}</td><td class="hide-xs">${won(tc)}</td>
      <td class="col-green">${won(tm)}</td>
      <td>${pct(tm,tt)}</td>
    </tr></tfoot>
  </table></div>`;
}

/* ── Detail view ── */
function renderDetail(rows) {
  const panel = document.getElementById('panel-detail');
  if (!rows.length) { panel.innerHTML = emptyHtml(); return; }

  const sorted = [...rows].sort((a,b) => b.date.localeCompare(a.date) || a.name.localeCompare(b.name));

  const body = sorted.map(r => {
    const badge = r.source === 'pos'
      ? '<span class="badge bdg-pos">카드</span>'
      : `<span class="badge bdg-cash">${r.pay === '계좌이체' ? (r.bank||'계좌') : '현금'}</span>`;
    const unitCost  = r.qty ? Math.round(r.cost / r.qty) : 0;
    const avgSale   = r.qty ? Math.round(r.salePrice / r.qty) : 0;
    const safeJson = JSON.stringify(r.name);
    const editBtn = `<button class="cost-edit-btn" onclick="openCostEditor(${safeJson},${unitCost},${avgSale})">✎ 원가</button>`;
    const costCol = r.matched
      ? `${won(r.cost)} ${editBtn}`
      : `<span class="col-warn" style="font-size:11px">미확인</span> ${editBtn}`;
    return `<tr>
      <td>${r.date}</td>
      <td>${badge}</td>
      <td>${r.name}<br><span style="margin-top:3px;display:inline-block">${editBtn}</span></td>
      <td>${r.qty}</td>
      <td>${won(r.salePrice)}</td>
      <td class="hide-xs">${r.matched ? won(r.cost) : '<span class="col-warn" style="font-size:11px">미확인</span>'}</td>
      <td class="col-green">${won(r.margin)}</td>
    </tr>`;
  }).join('');

  panel.innerHTML = `<div class="tbl-wrap"><table class="tbl">
    <thead><tr>
      <th>날짜</th><th>결제</th>
      <th>제품명</th><th>수량</th>
      <th>판매가</th><th class="hide-xs">원가</th>
      <th>마진</th>
    </tr></thead>
    <tbody>${body}</tbody>
  </table></div>`;
}

/* ── Empty / Warn ── */
function emptyHtml() {
  if (activeSource === 'pos' && !posRows.length) {
    return `<div class="empty">
      <div class="empty-icon">📂</div>
      <h3>POS 엑셀을 업로드해주세요</h3>
      <p>카드·POS 매출 엑셀 파일을 위 버튼으로 올리면<br>날짜별·제품별 마진을 자동 계산해드려요.</p>
      <div class="empty-hint">지원 형식: .xlsx / .xls (여러 파일 동시 업로드 가능)</div>
    </div>`;
  }
  if (activeSource === 'cash' && !cashRaw.length) {
    return `<div class="empty">
      <div class="empty-icon">🏦</div>
      <h3>이달 현금·계좌 데이터 없음</h3>
      <p>매출관리 앱에서 입력된 현금·계좌 매출이 없거나<br>Firebase 연결을 확인해주세요.</p>
    </div>`;
  }
  if (activeSource === 'all' && !posRows.length && !cashRaw.length) {
    return `<div class="empty">
      <div class="empty-icon">📊</div>
      <h3>이달 데이터 없음</h3>
      <p>POS 엑셀을 업로드하거나 다른 월을 선택해보세요.</p>
    </div>`;
  }
  return `<div class="empty">
    <div class="empty-icon">🔍</div>
    <h3>${filterMonth} 데이터 없음</h3>
    <p>다른 기간을 선택해보세요.</p>
  </div>`;
}

function buildWarnBanner() {
  if (unmatchedSet.size === 0 || activeSource === 'cash') return '';

  // 이미 저장된 원가가 있는 아이템은 여기선 unmatchedSet에 없으므로 순수 미확인만 표시
  const items = [...unmatchedSet].map(name => {
    const key  = customCostKey(name);
    const safe = name.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    const uid  = 'ce_' + key.slice(0, 30).replace(/[^a-zA-Z0-9가-힣]/g, '');
    const savedId = uid + '_ok';
    return `<div class="unmatched-item">
      <span class="unmatched-name">${name}</span>
      <div class="cost-edit-wrap">
        <input class="cost-edit-input" type="number" min="0" step="100"
               id="${uid}" placeholder="원가 (원)"
               onkeydown="if(event.key==='Enter') saveCustomCost('${safe}', this, document.getElementById('${savedId}'))">
        <button class="cost-save-btn"
          onclick="saveCustomCost('${safe}', document.getElementById('${uid}'), document.getElementById('${savedId}'))">저장</button>
        <span class="cost-saved-ok" id="${savedId}">✓ 저장됨</span>
      </div>
    </div>`;
  }).join('');

  return `<div class="warn-banner" style="flex-direction:column;gap:6px">
    <div>⚠️ <b>원가 미확인 ${unmatchedSet.size}개</b> — 원가를 직접 입력하면 다음에도 자동 적용돼요.</div>
    <div class="unmatched-list">${items}</div>
  </div>`;
}

/* ═══════════ CONTROLS ═══════════ */
function setSource(src, btn) {
  activeSource = src;
  document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setTab(tab, btn) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  render();
}

document.getElementById('monthPick').addEventListener('change', function() {
  filterMonth = this.value;
  // 월 바뀌면 결제수단별 매출 + 고정지출 금액 새로 로드
  payTotals = { card: 0, easy: 0, cash: 0 };
  expenseAmounts = {};
  try {
    const storeCode = localStorage.getItem('ws_store_code') || 'store1';
    const db = firebase.database();
    loadPayTotals(db, storeCode);
    loadExpenseAmounts(db, storeCode);
  } catch(e) {}
  render();
});
</script>
